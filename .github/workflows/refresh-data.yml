name: Refresh hero data
on:
  schedule:
    - cron: '0 3 * * *' # daily, 03:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs 3
      - name: Commit if changed
        run: |
          git config user.name "lastpick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "data: refresh matchups $(date -u +%F)"
          git push
      # Cloudflare Workers deploy (worker dota-lastpick). Needs repo secrets CLOUDFLARE_API_TOKEN
      # (Workers Scripts:Edit) + CLOUDFLARE_ACCOUNT_ID; skipped while they are unset.
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          npm ci
          npm run build
          npx wrangler@4.157.0 deploy
