name: Refresh hero data
on:
  schedule:
    - cron: '0 3 * * *' # daily, 03:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs 3
      - name: Commit if changed
        run: |
          git config user.name "lastpick-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "data: refresh matchups $(date -u +%F)"
          git push

  # The live site is the Cloudflare Worker built from branch `cloudflare` (Vercel blocked
  # since 2026-11-03). Ship today's data.json there too, so the site never goes stale.
  deploy-cloudflare:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare
      - name: Take today's data from master
        run: |
          git fetch --depth=1 origin master
          git checkout FETCH_HEAD -- public/data.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run security:verify
      - run: npm run build
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
